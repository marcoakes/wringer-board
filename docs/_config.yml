# GitHub Pages configuration for this folder.
#
# Publishing is Settings -> Pages -> Deploy from a branch -> `main` / `/docs`.
# This file is what makes that switch produce a readable page rather than a
# directory listing; it is committed BEFORE publication on purpose, so
# enabling Pages is one click and not a second round of edits.
#
# No `.nojekyll` here, deliberately: `index.md` is markdown and needs Jekyll to
# become HTML. The captures under `captures/` are already complete HTML files
# and Jekyll copies them through untouched, which is why they carry no front
# matter — they are evidence, and evidence is not re-rendered.
title: wringer-board
description: >-
  One page that tells you what is actually done — and shows you the proof.
theme: jekyll-theme-primer

# Nothing under here is a page. `captures/` holds committed renders; excluding
# the source tree keeps Pages from trying to serve the package.
exclude:
  - ../src
  - ../tests
  - ../pyproject.toml
