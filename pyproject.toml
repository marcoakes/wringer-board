[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wringer-board"
dynamic = ["version"]
description = "The requirements board for a Wringer repository — one page a PM can read."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wringer-board = "wringer_board.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "wringer_board.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
